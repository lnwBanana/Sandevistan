name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          ls -R | head -40
          D=$(dirname "$(find . -name gradlew -print -quit)")
          cd "$D"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: sandevistan-jar
          path: "**/build/libs/*.jar"
